# ReadMeow: redraws your README cards (stats, languages, projects) once a day.
name: ReadMeow refresh
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Redraw cards
        run: node .readmeow/refresh.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "readmeow-bot"
          git config user.email "readmeow-bot@users.noreply.github.com"
          git add assets/readmeow
          git diff --cached --quiet || (git commit -m "ReadMeow: refresh cards" && git push)
